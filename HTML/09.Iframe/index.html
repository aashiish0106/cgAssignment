<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .responsive-iframe {
            width: 100%;
            height: 400px;
            border: none;
            margin: 10px;
        }
    </style>
</head>
<body>
    <iframe src="https://www.example.com" width="100%" height="400" title="Example Domain Main Site" style="border: none;"></iframe>

    <p><a href="https://www.example.com" target="targetFrame">Open Example Site</a></p>
    <iframe name="targetFrame" width="100%" height="300" title="Targeted Example Frame" style="border: 1px solid #ccc;"></iframe>

    <iframe width="560" height="315" src="https://www.youtube.com/embed/xvT1jH8B9AM?si=bGBk3aOyVMVgOaoO" title="YouTube video player" frameborder="0" allow=" gyroscope; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <iframe src="https://www.wikipedia.org/" class="responsive-iframe" title="Responsive Example Frame"></iframe>


    <iframe src="https://pixabay.com/videos/download/video-348656_medium.mp4" width="800" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

    <iframe src="https://www.youtube.com/watch?v=V9vuCByb6js" width="100%" height="500" allow="gyroscope" title="360 Degree Panoramic Viewer" style="border: none;"></iframe>




</body>
</html>
